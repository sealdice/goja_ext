on: [push, pull_request]
name: Test

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
      - name: Check formatting
        run: diff -u <(echo -n) <(gofmt -d .)
        if: runner.os != 'Windows'
      - name: Run go vet
        run: go vet ./...
      - name: Run staticcheck
        uses: dominikh/staticcheck-action@v1.3.1
        with:
          version: "2026.1"
          install-go: false
          cache-key: go-1.25
      - name: Run tests
        run: go test -vet=off ./...

  test-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          npm ci
          npm test --workspaces

  test-replace-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache-dependency-path: compatibility/go.sum
      - name: Test goja_nodejs replacement
        working-directory: compatibility
        run: |
          go test -mod=readonly ./...
          ! go list -m all | grep -q '^github.com/sealdice/goja_ext\($\| \)'
